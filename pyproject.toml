[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgram"
version = "1.4.3"
description = "Skill management for AI agents: one SKILL.md library (a skill hub and registry) linked into Claude Code, Codex, Cursor, Hermes, Reasonix and any harness that reads skills. No copies, no drift."
readme = "README.pypi.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xhuk" }]
keywords = [
  "skill-management",
  "agent-skills",
  "ai-agents",
  "skill-registry",
  "skill-library",
  "skill-hub",
  "admin-skills",
  "llm-tools",
  "mcp",
  "skills",
  "agents",
  "claude-code",
  "claude-skills",
  "codex",
  "hermes",
  "cursor",
  "gemini-cli",
  "reasonix",
  "opencode",
  "symlink",
  "junctions",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.scripts]
skillgram = "skillgram:main"

[project.urls]
Homepage = "https://github.com/Xhuk/skillgram"
Issues = "https://github.com/Xhuk/skillgram/issues"

[tool.setuptools]
py-modules = ["skillgram"]
