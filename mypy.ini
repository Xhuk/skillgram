[mypy]
# mypy 2.x dropped 3.9 as a target; the runtime floor is still 3.9 and the real
# guarantee is the CI matrix (3.9/3.11/3.13), not this config.
python_version = 3.10
files = skillgram
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
show_error_codes = True
check_untyped_defs = False
disallow_untyped_defs = False
# This tool's contract is a JSON dict. The value here is catching names, signatures
# and returns -- the class of bug that shipped a `categoria` key for months. The
# inference noise of dict-of-object is exactly that: noise.
disable_error_code = assignment, var-annotated, misc, operator, arg-type, index

[mypy-tests.*]
ignore_errors = True
