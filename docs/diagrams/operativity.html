<main>

  <h1>How skillgram operates</h1>
  <p class="dek">Three plates. No screenshots, no runtime required: the loop, the files it writes,
  and the arithmetic that decides which skills a repo is offered.</p>
  <div class="byline">
    <span>skillgram 1.5.0</span>
    <span>links, never copies</span>
    <span>stdlib only</span>
    <span><a href="../">← back to the summary</a></span>
  </div>

  <!-- ─────────────────────────────── PLATE I ─────────────────────────────── -->
  <figure id="loop">
    <figcaption>
      <span class="plate-no">Plate I</span>
      <div class="plate-title">The loop, on one page</div>
      <p class="plate-dek">The library is the store; a project is a view of it; the usage record is
      what the view remembers. Everything below is a command you can run, not a dataflow diagram of
      internals.</p>
    </figcaption>

    <div class="frame">
    <svg viewBox="0 0 820 400" role="img" aria-label="Hub, harnesses, project scope, usage record and seeds forming a loop">
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="mk-flow" d="M 0 0 L 10 5 L 0 10 z"/>
        </marker>
        <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="mk-live" d="M 0 0 L 10 5 L 0 10 z"/>
        </marker>
      </defs>

      <!-- 01 · the store -->
      <text class="tag" x="16" y="22">01 · store</text>
      <rect class="box-hub" x="16" y="34" width="196" height="150" rx="8"/>
      <text class="lbl" x="32" y="58">~/.agents/skills</text>
      <text class="sub" x="32" y="80">&lt;category&gt;/&lt;skill&gt;/</text>
      <text class="sub" x="32" y="98">SKILL.md · the only copy</text>
      <text class="sub" x="32" y="116">SKILLMETA.json · hash</text>
      <line class="rule" x1="32" y1="130" x2="196" y2="130"/>
      <text class="sub" x="32" y="150">one file, every harness</text>
      <text class="sub" x="32" y="168">reads it as its own</text>

      <!-- 02 · the views -->
      <text class="tag" x="300" y="22">02 · views</text>
      <rect class="box" x="300" y="34" width="200" height="34" rx="6"/>
      <text class="lbl" x="314" y="56">Reasonix</text>
      <text class="sub" x="488" y="56" text-anchor="end">.reasonix/skills</text>
      <rect class="box" x="300" y="78" width="200" height="34" rx="6"/>
      <text class="lbl" x="314" y="100">Claude Code</text>
      <text class="sub" x="488" y="100" text-anchor="end">.claude/skills</text>
      <rect class="box" x="300" y="122" width="200" height="34" rx="6"/>
      <text class="lbl" x="314" y="144">Codex</text>
      <text class="sub" x="488" y="144" text-anchor="end">.codex/skills</text>
      <text class="sub" x="300" y="178">+ 51 more, same library</text>

      <path class="flow" d="M 212 62 C 256 62, 258 51, 298 51" marker-end="url(#a)"/>
      <path class="flow" d="M 212 104 L 298 95" marker-end="url(#a)"/>
      <path class="flow" d="M 212 132 C 256 132, 258 139, 298 139" marker-end="url(#a)"/>
      <text class="tag" x="222" y="200">links</text>

      <!-- 03 · the set -->
      <text class="tag" x="600" y="22">03 · the set</text>
      <rect class="box" x="600" y="34" width="204" height="150" rx="8"/>
      <text class="lbl" x="616" y="58">&lt;repo&gt;/.agents</text>
      <text class="sub" x="616" y="80">config.json · project name</text>
      <text class="sub" x="616" y="98">skills.json · the set,</text>
      <text class="sub" x="616" y="114">with hashes</text>
      <text class="sub" x="616" y="132">skills/&lt;name&gt; → link</text>
      <line class="rule" x1="616" y1="146" x2="788" y2="146"/>
      <text class="sub" x="616" y="166">committed · the memory</text>

      <path class="live" d="M 500 139 C 552 139, 556 108, 598 108" marker-end="url(#b)"/>
      <text class="tag on" x="506" y="126">mount</text>

      <!-- 04 · what it remembers -->
      <text class="tag" x="600" y="228">04 · the record</text>
      <rect class="box" x="600" y="240" width="204" height="76" rx="8"/>
      <text class="sub" x="616" y="262">use_count · last_used</text>
      <text class="sub" x="616" y="280">last_used_by · by_harness</text>
      <text class="sub" x="616" y="302">declared, never observed</text>
      <path class="live" d="M 702 184 L 702 238" marker-end="url(#b)"/>
      <text class="tag on" x="710" y="214">touch</text>
      <text class="sub" x="600" y="336">the next session reads this file</text>

      <!-- 05 · taste -->
      <text class="tag" x="16" y="228">05 · taste</text>
      <rect class="box" x="16" y="240" width="196" height="76" rx="8"/>
      <text class="lbl" x="32" y="262">skillgram seed</text>
      <text class="sub" x="32" y="282">qring-anti-slop</text>
      <text class="sub" x="32" y="302">always recommended</text>

      <path class="live" d="M 212 278 L 266 278" marker-end="url(#b)"/>
      <rect class="box" x="270" y="258" width="132" height="40" rx="20"/>
      <text class="lbl" x="286" y="283">bootstrap</text>
      <path class="live" d="M 402 268 C 470 240, 520 200, 598 170" marker-end="url(#b)"/>
      <text class="sub" x="446" y="300">signals + seeds → the set</text>
    </svg>

    <ol class="legend">
      <li><b>One store.</b> Every skill exists once, in the hub. Nothing is copied into an agent.</li>
      <li><b>Views, not copies.</b> Each harness gets links into that store, so fifty agents cannot drift from each other.</li>
      <li><b>The set is a project file.</b> <code>use</code> writes <code>.agents/skills.json</code>; <code>mount</code> materialises it in every harness layout the project needs.</li>
      <li><b>The record is declared.</b> <code>touch</code> and <code>use</code> write who used what, from which harness. skillgram cannot see what an agent reads, and never pretends to.</li>
      <li><b>Taste is explicit.</b> A seed (<code>skillgram seed &lt;skill&gt;</code>) outranks the ranking in every future <code>bootstrap</code>; <code>--never</code> does the opposite.</li>
    </ol>
    </div>
  </figure>

  <!-- ─────────────────────────────── PLATE II ────────────────────────────── -->
  <figure id="mount">
    <figcaption>
      <span class="plate-no">Plate II</span>
      <div class="plate-title">What <code>mount --apply</code> leaves in a repo</div>
      <p class="plate-dek">The dangerous part of a link is that git does not know what one is: it
      sees a directory and would commit the skill as a copy. So the scope is tracked and the links
      are not.</p>
    </figcaption>

    <div class="frame">
      <div class="spread">
<pre class="tree">&lt;repo&gt;/
├── AGENTS.md                          <span class="hit">+ protocol block</span>
├── .gitignore                         <span class="hit">+ links block</span>
├── .agents/
│   ├── config.json                    <span class="dim">tracked · project name</span>
│   ├── skills.json                    <span class="dim">tracked · the set + hashes</span>
│   └── skills/deploy → hub            <span class="dim">link · ignored</span>
├── .claude/skills/deploy → hub        <span class="dim">link · ignored</span>
├── .codex/skills/deploy → hub         <span class="dim">link · ignored</span>
├── .cursor/skills/deploy → hub        <span class="dim">link · ignored</span>
└── … one dir per installed harness</pre>

        <dl class="notes">
          <dt><span class="swatch in"></span>Tracked</dt>
          <dd>The two JSON files are the project's memory: what it has, with the hash that detects
          drift. Commit them — that is what the next harness reads.</dd>

          <dt><span class="swatch out"></span>Ignored</dt>
          <dd>A delimited block in <code>.gitignore</code> covers every directory the mount writes,
          so <code>git add -A</code> cannot turn a link into a copy. Idempotent; delete the block to
          undo it.</dd>

          <dt>Protocol</dt>
          <dd>The block between <code>&lt;!-- skillgram:protocol:begin --&gt;</code> markers tells any
          agent, in any harness, to read the record before choosing and to declare what it used.</dd>

          <dt>Reversible</dt>
          <dd><code>skillgram unuse &lt;skill&gt;…</code> drops links and manifest entries; nothing
          in the hub is touched.</dd>
        </dl>
      </div>
    </div>
  </figure>

  <!-- ────────────────────────────── PLATE III ────────────────────────────── -->
  <figure id="ranking">
    <figcaption>
      <span class="plate-no">Plate III</span>
      <div class="plate-title">How a candidate earns its place</div>
      <p class="plate-dek">Deterministic scoring, no model in the loop: where a tag appears decides
      its weight, anything under the line is dropped instead of padding the list, and a seed comes
      first whatever its score.</p>
    </figcaption>

    <div class="frame">
      <div class="spread">
        <div>
          <table class="score">
            <tr><th>Where the tag appears</th><th class="n">Weight</th></tr>
            <tr class="keep"><td>skill <b>name</b></td><td class="n">3</td></tr>
            <tr><td>skill <b>category</b></td><td class="n">2</td></tr>
            <tr><td>body of <code>SKILL.md</code></td><td class="n">1</td></tr>
            <tr class="drop"><td>below <b>2</b> — dropped</td><td class="n">—</td></tr>
          </table>

          <table class="score" style="margin-top:26px">
            <tr><th>Real repo: go + vite + react</th><th class="n">before</th><th class="n">after</th></tr>
            <tr class="keep"><td>a React skill by name</td><td class="n">tie</td><td class="n">1st</td></tr>
            <tr><td>a body-only mention</td><td class="n">tie</td><td class="n">—</td></tr>
            <tr class="drop"><td>godmode <span class="sub">(“go” as a fragment)</span></td><td class="n">listed</td><td class="n">gone</td></tr>
            <tr class="drop"><td>nodejs-keccak256 <span class="sub">(for React)</span></td><td class="n">listed</td><td class="n">gone</td></tr>
            <tr><td>a seeded skill</td><td class="n">—</td><td class="n">first</td></tr>
          </table>
        </div>

        <dl class="notes">
          <dt>A tag is a word</dt>
          <dd><code>go</code> matches <code>golang-patterns</code> and not <code>godmode</code>;
          <code>ts</code> matches <code>typescript</code>; <code>node</code> does not match
          <code>nodejs-keccak256</code>. Aliases handle the tags that are not words.</dd>

          <dt>Signals are the repo's, not the root's</dt>
          <dd>Manifests from the root and its immediate subdirectories
          (<code>backend/go.mod</code>, <code>frontend/package.json</code>), and only dependencies
          that name a stack become tags. A flattened lockfile in <code>dependencies</code> is not a
          stack.</dd>

          <dt>Ties break on evidence</dt>
          <dd>Score, then how many distinct tags matched, then the shorter name. Alphabetical order
          is never the reason a skill is recommended.</dd>

          <dt>Taste overrules</dt>
          <dd><code>seed</code> is a decision, so it is not scored: the seeded skill is offered
          first, and <code>bootstrap --apply</code> promotes it even with no LLM configured.</dd>
        </dl>
      </div>
    </div>
  </figure>
